<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1;
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url);
              target.close = function() {};
              target.send = function() {};
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(e) {
          if (e && (e.message && e.message.indexOf('WebSocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <title>Ripcord - Fast Video & Audio Downloader</title>
    <meta name="description" content="High-speed local YouTube video and audio downloader supporting batch queues, concurrent streams, local folder storage, and audio extraction." />
    <meta property="og:title" content="Ripcord - Fast Video & Audio Downloader" />
    <meta property="og:description" content="High-speed local YouTube video and audio downloader supporting batch queues, concurrent streams, local folder storage, and audio extraction." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ripcord" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>

  </body>
</html>
