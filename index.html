    <script>
      (function() {
        // HMR is disabled in AI Studio sandbox. Shim vite-hmr WebSockets so createWebSocketModuleRunnerTransport never fails.
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteHMRWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url);
              target.close = function() {};
              target.send = function() {};
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteHMRWebSocket.prototype = NativeWebSocket.prototype;
          ViteHMRWebSocket.CONNECTING = 0;
          ViteHMRWebSocket.OPEN = 1;
          ViteHMRWebSocket.CLOSING = 2;
          ViteHMRWebSocket.CLOSED = 3;
          window.WebSocket = ViteHMRWebSocket;
        }

        window.addEventListener('error', function(e) {
          if (e && (e.message?.includes('WebSocket') || e.message?.includes('@vite/client') || e.filename?.includes('@vite/client'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
            e.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
